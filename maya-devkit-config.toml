# File extraction patterns for different archive types
[devkit.extraction]
zip_pattern = "*devkit*"
tgz_pattern = "*devkit*"
dmg_pattern = "*devkit*"

# Platform-specific DevKit directory structure
[devkit.structure]
windows = "devkitBase"
linux = "devkitBase"
macos = "devkitBase"
