[workspace]
members = [".", "crates/umbrella-core"]
resolver = "2"

[package]
name = "umbrella_maya_plugin"
version = "0.3.1"
edition = "2024"
rust-version = "1.95"
authors = ["Maya Umbrella Team", "loonghao <hal.long@outlook.com>"]
description = "High-performance Rust implementation of maya_umbrella - Maya antivirus plugin that bypasses Python security restrictions"
license = "MIT"
repository = "https://github.com/loonghao/umbrella_maya_plugin"
homepage = "https://github.com/loonghao/umbrella_maya_plugin"
keywords = ["maya", "antivirus", "security", "plugin", "rust"]
categories = ["multimedia", "development-tools"]

[lib]
name = "umbrella_maya_plugin"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "cargo-maya-build"
path = "src/bin/cargo-maya-build.rs"

[[bin]]
name = "umbrella-maya"
path = "src/bin/umbrella-maya.rs"

[dependencies]
umbrella-core = { path = "crates/umbrella-core" }
libc = "0.2"
thiserror = "2.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
pyo3 = { version = "0.28.3", optional = true, features = ["extension-module", "abi3", "abi3-py38"] }
# Build tool dependencies
clap = { version = "4.0", features = ["derive"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# reqwest is only used by src/bin/cargo-maya-build.rs, but Cargo resolves dependencies
# per package, so the wheel build (--lib) compiles it too. default-features = false with
# rustls-tls swaps the TLS backend from native-tls to rustls and drops openssl-sys from
# the graph entirely: the manylinux container that builds the Python wheels ships no
# OpenSSL development package, so a native-tls build fails there with "No package
# 'openssl' found". The other default features are listed explicitly so that only the
# TLS backend changes (charset, http2, macos-system-configuration).
reqwest = { version = "0.12", default-features = false, features = ["charset", "http2", "json", "macos-system-configuration", "rustls-tls"] }
zip = "4.0.0"
walkdir = "2.0"
colored = "3.0"
chrono = { version = "0.4", features = ["serde"] }
glob = "0.3"
async-fs = "2.1"
flate2 = "1.0"
tar = "0.4"
toml = "0.8"

[build-dependencies]
bindgen = "0.71"
cc = "1.2"
cbindgen = "0.29"
pyo3-build-config = "0.28.3"

[features]
default = []
maya_bindings = []
python = ["dep:pyo3"]
# Maya version features
maya2018 = ["maya_bindings"]
maya2019 = ["maya_bindings"]
maya2020 = ["maya_bindings"]
maya2021 = ["maya_bindings"]
maya2022 = ["maya_bindings"]
maya2023 = ["maya_bindings"]
maya2024 = ["maya_bindings"]
maya2025 = ["maya_bindings"]
maya2026 = ["maya_bindings"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
