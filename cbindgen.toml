# cbindgen configuration for umbrella maya plugin
language = "C"
header = "/* Umbrella Maya Plugin - Generated C bindings */"
include_version = true
cpp_compat = true
style = "both"

[export]
include = ["UmbrellaResult", "UmbrellaConfig", "ScanResult", "CleanFFIResult"]
exclude = ["MObject", "MStatus", "testFunction", "initializePlugin", "uninitializePlugin"]

[parse]
parse_deps = true
include = ["umbrella_maya_plugin"]

[struct]
derive_eq = true
derive_neq = true

[enum]
prefix_with_name = true

[defines]
"feature = maya_bindings" = "MAYA_BINDINGS_ENABLED"
