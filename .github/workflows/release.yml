name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      upload_to_release:
        description: "Upload artifacts to the GitHub Release for the selected tag/ref"
        required: false
        type: boolean
        default: false
      release_tag:
        description: "Release tag to upload artifacts to when dispatching manually"
        required: false
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Pinned so the cbindgen CLI that generates the C header matches the cbindgen library
  # the build script uses (Cargo.lock pins the build-dependency). A caret requirement
  # would follow new patch releases and would invalidate the binary cache below on
  # every upstream release.
  CBINDGEN_VERSION: "0.29.2"
  MAYA_DEVKIT_URL_2018_WINDOWS: ${{ secrets.MAYA_DEVKIT_URL_2018_WINDOWS }}
  MAYA_DEVKIT_URL_2018_LINUX: ${{ secrets.MAYA_DEVKIT_URL_2018_LINUX }}
  MAYA_DEVKIT_URL_2018_MACOS: ${{ secrets.MAYA_DEVKIT_URL_2018_MACOS }}
  MAYA_DEVKIT_URL_2021_WINDOWS: ${{ secrets.MAYA_DEVKIT_URL_2021_WINDOWS }}
  MAYA_DEVKIT_URL_2021_LINUX: ${{ secrets.MAYA_DEVKIT_URL_2021_LINUX }}
  MAYA_DEVKIT_URL_2021_MACOS: ${{ secrets.MAYA_DEVKIT_URL_2021_MACOS }}

jobs:
  build:
    name: Maya ${{ matrix.maya_version }} ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        maya_version: ["2018", "2019", "2020", "2021", "2022", "2023", "2024", "2025", "2026"]
        platform:
          # Maya 2024 and newer certify Visual Studio 2022, so Windows release builds
          # stay on the windows-2022 image instead of following the newest hosted image.
          - name: windows
            os: windows-2022
            rust_target: x86_64-pc-windows-msvc
          # Certified Maya Linux hosts run glibc 2.28-2.35 with libstdc++ up to
          # GLIBCXX_3.4.29. The newest Ubuntu image ships glibc 2.39 with GCC 13, so the
          # plugin it builds requires GLIBC_2.38 / GLIBCXX_3.4.32 and fails to load there.
          # Linux release builds stay on the image inside the certified range.
          - name: linux
            os: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
          - name: macos
            os: macos-15-intel
            rust_target: x86_64-apple-darwin
        exclude:
          - maya_version: "2018"
            platform:
              name: macos
              os: macos-15-intel
              rust_target: x86_64-apple-darwin
          - maya_version: "2021"
            platform:
              name: windows
              os: windows-2022
              rust_target: x86_64-pc-windows-msvc
          - maya_version: "2021"
            platform:
              name: linux
              os: ubuntu-22.04
              rust_target: x86_64-unknown-linux-gnu
          - maya_version: "2021"
            platform:
              name: macos
              os: macos-15-intel
              rust_target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.platform.rust_target }}

      - uses: loonghao/vx@v0.8.36

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: maya-${{ matrix.platform.name }}-${{ matrix.maya_version }}
          shared-key: maya-${{ matrix.platform.name }}-${{ matrix.maya_version }}

      - name: Cache Maya DevKit
        uses: actions/cache@v4
        with:
          path: maya-devkit
          key: maya-devkit-${{ matrix.platform.name }}-${{ matrix.maya_version }}-${{ hashFiles('maya-devkit-config.toml') }}

      - name: Cache cbindgen
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          # Building cbindgen from source costs about a minute on every one of the Linux
          # lanes in this matrix. Swatinem/rust-cache does not cover $CARGO_HOME/bin, so
          # the installed binary is cached here instead.
          path: ~/.cargo/bin/cbindgen
          key: cbindgen-${{ runner.os }}-${{ runner.arch }}-${{ env.CBINDGEN_VERSION }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake
          # The CMake generate_bindings target and src/bin/cargo-maya-build.rs both shell
          # out to the cbindgen CLI, so it has to keep working on PATH. Prebuilt cbindgen
          # binaries can require a newer glibc than this image provides, so build the
          # pinned version from source whenever the one on PATH cannot run here.
          echo "cbindgen before install: $(cbindgen --version 2>/dev/null || echo 'missing or not runnable')"
          if ! cbindgen --version >/dev/null 2>&1; then
            cargo install cbindgen --version "=$CBINDGEN_VERSION" --locked --force
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          cbindgen --version

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install cmake || true

      - name: Build Maya module package
        run: vx just package ${{ matrix.maya_version }}

      - name: Validate Maya module package
        shell: pwsh
        run: scripts/test-maya-artifacts.ps1 -MayaVersion ${{ matrix.maya_version }} -Platform ${{ matrix.platform.name }}

      - name: Build CLI
        run: vx just build-cli

      - name: Build Python extension
        run: vx just build-pyd

      - name: Stage release package
        shell: pwsh
        run: scripts/stage-release-package.ps1 -MayaVersion ${{ matrix.maya_version }} -Platform ${{ matrix.platform.name }}

      - name: Validate release archive
        shell: pwsh
        run: scripts/test-maya-artifacts.ps1 -MayaVersion ${{ matrix.maya_version }} -Platform ${{ matrix.platform.name }} -RequireReleaseArchive

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: UmbrellaMayaPlugin-maya${{ matrix.maya_version }}-${{ matrix.platform.name }}
          path: dist/release/*.zip
          retention-days: 30

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.upload_to_release == true)
        uses: softprops/action-gh-release@v3
        with:
          files: dist/release/*.zip
          generate_release_notes: false
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}

  python-wheels:
    name: Python wheel (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: windows
            os: windows-2022
          - name: linux
            os: ubuntu-22.04
          - name: macos
            os: macos-15-intel

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@1.95.0

      - name: Build Python wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --features python --strip --out dist/wheels
          manylinux: auto

      - name: Upload Python wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-wheels-${{ matrix.platform.name }}
          path: dist/wheels/*.whl
          retention-days: 30

  publish-pypi:
    name: Publish Python wheels to PyPI
    needs: python-wheels
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.upload_to_release == true && inputs.release_tag != '')
    env:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - name: Download Python wheels
        uses: actions/download-artifact@v5
        with:
          pattern: python-wheels-*
          path: dist/wheels
          merge-multiple: true

      - name: Publish to PyPI with API token
        if: env.PYPI_API_TOKEN != ''
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/wheels
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

      - name: Publish to PyPI with trusted publishing
        if: env.PYPI_API_TOKEN == ''
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/wheels
          skip-existing: true
